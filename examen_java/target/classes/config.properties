# ==========================================
# HotelNova - General system configuration
# ==========================================

# ==========================================
# Database parameters (MySQL)
# ==========================================
# Connection URL for the hotel_nova_db database on localhost
# Format: jdbc:mysql://<host>:<port>/<db_name>
db.url=jdbc:mysql://localhost:3306/hotel_nova_db

# Database access user
db.user=root

# Database user password
# Adjust according to local or exam environment
db.password=1234

# ==========================================
# Business configuration
# ==========================================
# Official check-in time (24h format)
checkInHour=15
horaCheckIn=15

# Official check-out time (24h format)
checkOutHour=12
horaCheckOut=12

# VAT applied to reservations and services
vat=0.19
iva=0.19
